name: release-please

on:
  push:
    branches: [master]

permissions: {}

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      # Use an App token, not GITHUB_TOKEN. Events created with GITHUB_TOKEN do
      # not start new workflow runs, so the Release PR would get no CI and the
      # tag it creates would not trigger publish.yml. An App token does both.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # Maintains a Release PR from conventional commits. Merging it bumps the
      # root version and packages/reevesagents-win in lockstep (extra-files),
      # writes CHANGELOG.md, creates the vX.Y.Z tag and the GitHub release. The
      # tag then triggers publish.yml.
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: master
