name: test

on:
  workflow_dispatch:
  push:
    branches: [master, main, 'release/**']
  pull_request:
    branches: [master, main, 'release/**']

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

      # The native-Windows sibling ships as its own npm package but never ran in
      # CI. Run its full gate too so a broken win build is caught before release.
      - run: pnpm --filter reevesagents-win verify
