name: publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify:release

      # npm 11.5.1+ is required for OIDC trusted publishing (and ships automatic
      # provenance). Keep this pinned so a new npm major cannot change the Node
      # engine requirement under the release workflow.
      - name: Use npm 11 for publishing
        run: npm install -g npm@11.5.1

      # Publishes the package built by verify:release. Uses npm OIDC trusted
      # publishing when a trusted publisher is configured for this package on
      # npmjs.com (no token, provenance is automatic); otherwise falls back to
      # NPM_TOKEN. --provenance is kept so provenance is generated either way.
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The native-Windows sibling ships from the same tag. release-please keeps
      # its version in lockstep (extra-files in release-please-config.json), so a
      # mismatch now means something is wrong: fail loudly instead of skipping.
      # Needs its own npm trusted publisher (or an NPM_TOKEN scoped to it).
      - name: Publish reevesagents-win to npm
        run: |
          WIN_VER="$(node -p "require('./packages/reevesagents-win/package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$WIN_VER" ]; then
            echo "tag $GITHUB_REF_NAME does not match reevesagents-win version $WIN_VER"
            exit 1
          fi
          pnpm --filter reevesagents-win build
          cd packages/reevesagents-win && npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Bumps the Homebrew tap formula (url + sha256) to the just-published version.
  # Runs after publish so the npm tarball exists for sha256 computation. Commits
  # directly to the tap (create-pullrequest/create-branch false); drop those two
  # lines to fall back to opening a PR on the tap instead. Reuses secrets.CI_PAT
  # (the classic PAT has repo write to mertkayacs/homebrew-reevesagents).
  homebrew:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: mislav/bump-homebrew-formula-action@f865c8b0dbebd6e263cc06782a0e974c61cf12d2 # v4.2
        with:
          formula-name: reevesagents
          formula-path: Formula/reevesagents.rb
          homebrew-tap: mertkayacs/homebrew-reevesagents
          push-to: mertkayacs/homebrew-reevesagents
          create-pullrequest: false
          create-branch: false
          tag-name: ${{ github.ref_name }}
          download-url: https://registry.npmjs.org/reevesagents/-/reevesagents-${{ steps.ver.outputs.version }}.tgz
        env:
          COMMITTER_TOKEN: ${{ secrets.CI_PAT }}
