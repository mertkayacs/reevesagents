name: publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify:release

      # npm 11.5.1+ is required for OIDC trusted publishing (and ships automatic
      # provenance). setup-node's bundled npm is older.
      - name: Use latest npm
        run: npm install -g npm@latest

      # Publishes the package built by verify:release. Uses npm OIDC trusted
      # publishing when a trusted publisher is configured for this package on
      # npmjs.com (no token, provenance is automatic); otherwise falls back to
      # NPM_TOKEN. --provenance is kept so provenance is generated either way.
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The native-Windows sibling ships from the same tag. It needs its own npm
      # trusted publisher (or an NPM_TOKEN scoped to reevesagents-win); until that
      # is set up, continue-on-error keeps a failure here from blocking the main
      # package above. The version must match the tag, so bump both together.
      - name: Publish reevesagents-win to npm
        continue-on-error: true
        run: |
          WIN_VER="$(node -p "require('./packages/reevesagents-win/package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$WIN_VER" ]; then
            echo "tag $GITHUB_REF_NAME does not match reevesagents-win version $WIN_VER; skipping"
            exit 1
          fi
          pnpm --filter reevesagents-win build
          cd packages/reevesagents-win && npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
