name: publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 12.13.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify:release

      # npm 11.5.1+ is required for OIDC trusted publishing (and ships automatic
      # provenance). Keep this pinned so a new npm major cannot change the Node
      # engine requirement under the release workflow.
      - name: Use npm 11 for publishing
        run: npm install -g npm@11.5.1

      # Publishes the package built by verify:release. Uses npm OIDC trusted
      # publishing when a trusted publisher is configured for this package on
      # npmjs.com (no token, provenance is automatic); otherwise falls back to
      # NPM_TOKEN. --provenance is kept so provenance is generated either way.
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The native-Windows sibling ships from the same tag. release-please keeps
      # its version in lockstep (extra-files in release-please-config.json), so a
      # mismatch now means something is wrong: fail loudly instead of skipping.
      # Needs its own npm trusted publisher (or an NPM_TOKEN scoped to it).
      - name: Publish reevesagents-win to npm
        run: |
          WIN_VER="$(node -p "require('./packages/reevesagents-win/package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$WIN_VER" ]; then
            echo "tag $GITHUB_REF_NAME does not match reevesagents-win version $WIN_VER"
            exit 1
          fi
          pnpm --filter reevesagents-win build
          cd packages/reevesagents-win && npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Registry listing and Homebrew bump live in post-publish.yml so they can be
  # re-run by hand for a tag without publishing to npm again.
  post-publish:
    needs: publish
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/post-publish.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
