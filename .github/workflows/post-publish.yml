name: post-publish

# Runs after publish.yml for every release tag, or by hand (Actions tab, Run
# workflow, enter the tag) when a step failed after npm already has the version.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.8.0
        type: string
        required: true

jobs:
  # Lists the npm version on the official MCP Registry
  # (registry.modelcontextprotocol.io). The registry checks mcpName in the
  # published package.json, and npm can take minutes to serve a new version,
  # so wait for it first. GitHub OIDC login needs id-token: write, no secret.
  mcp-registry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}

      - name: Wait for the version on npm
        env:
          TAG: ${{ inputs.tag }}
        run: |
          V="${TAG#v}"
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null "https://registry.npmjs.org/reevesagents/$V" && exit 0
            sleep 15
          done
          echo "reevesagents@$V is not on npm after 15 minutes"
          exit 1

      - name: Publish to the MCP Registry
        env:
          TAG: ${{ inputs.tag }}
        run: |
          for V in "$(jq -r .version server.json)" "$(jq -r '.packages[0].version' server.json)"; do
            if [ "${TAG#v}" != "$V" ]; then
              echo "tag $TAG does not match server.json version $V"
              exit 1
            fi
          done
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  # Bumps the Homebrew tap formula (url + sha256) to the published version.
  # Commits directly to the tap (create-pullrequest/create-branch false); drop
  # those two lines to open a PR on the tap instead. Reuses secrets.CI_PAT (the
  # classic PAT has repo write to mertkayacs/homebrew-reevesagents).
  homebrew:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - id: ver
        env:
          TAG: ${{ inputs.tag }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Wait for the tarball on npm
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null "https://registry.npmjs.org/reevesagents/-/reevesagents-$V.tgz" && exit 0
            sleep 15
          done
          echo "reevesagents-$V.tgz is not on npm after 15 minutes"
          exit 1

      - uses: mislav/bump-homebrew-formula-action@f865c8b0dbebd6e263cc06782a0e974c61cf12d2 # v4.2
        with:
          formula-name: reevesagents
          formula-path: Formula/reevesagents.rb
          homebrew-tap: mertkayacs/homebrew-reevesagents
          push-to: mertkayacs/homebrew-reevesagents
          create-pullrequest: false
          create-branch: false
          tag-name: ${{ inputs.tag }}
          download-url: https://registry.npmjs.org/reevesagents/-/reevesagents-${{ steps.ver.outputs.version }}.tgz
        env:
          COMMITTER_TOKEN: ${{ secrets.CI_PAT }}
